[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beahiv"
version = "0.1.0"
description = "BEAHIV: a fast, equal-area hexagonal grid index, with variable size and orientation for EPSG:27700"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beahiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "SIM", "UP"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.63",
]
